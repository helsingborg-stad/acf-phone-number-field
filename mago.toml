php-version = "8.3.0"

[source]
paths = ["acf-phone-number-field.php", "build.php", "source/php", "tests"]
includes = [
    "vendor",
    ".cache/tests/wordpress-develop-7.1.4/src",
    ".cache/tests/wordpress-develop-7.1.4/tests/phpunit/includes",
    ".cache/tests/acf-6.8.11",
]

[linter]
integrations = ["phpunit"]

[linter.rules]
literal-named-argument = { enabled = false }
no-shorthand-ternary = { enabled = false }
assertion-style = { style = "self_" }

[analyzer]
find-unused-definitions = false
